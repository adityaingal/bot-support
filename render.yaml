# Render Blueprint for Support
#
# Architecture:
#   support-web-api       -> Discord bot + FastAPI dashboard backend (one process,
#                            the API routes read the live bot client)
#   support-web-dashboard -> Next.js dashboard
#
# The bot service is a *web* service (not a background worker) because this
# project's API/health endpoint must be reachable by the dashboard and by
# Render's health checker. The Discord gateway connection lives inside the same
# process; discord.py handles gateway reconnects itself.
#
# Restart behaviour: Render restarts the instance whenever the process exits
# (crash, deploy, SIGTERM). Do not add a custom restart loop in Python.
services:
  - type: web
    name: support-web-api
    runtime: python
    rootDir: bot
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Render root directory is "bot", so the entry point is CodeX.py (not bot/CodeX.py)
    startCommand: python CodeX.py
    healthCheckPath: /health
    envVars:
      # MUST be fully qualified (e.g. 3.11.9) — bare "3.11" is ignored by
      # Render and it falls back to its default (3.14.x), which breaks
      # discord.py login with "Session is closed".
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_ENABLED
        value: "true"
      - key: brand_name
        value: Support
      - key: CREATOR_NAME
        value: OGADI
      - key: CREATOR_ID
        sync: false
      - key: SUPPORT_SERVER_URL
        value: https://discord.gg/UVRWygSpJq
      - key: DISCORD_STATUS
        value: online
      - key: BOT_ACTIVITY
        value: Support | >help
      - key: TUNNEL_ENABLED
        value: "false"
      - key: TOKEN
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
      - key: OWNER_IDS
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_SECURE
        value: "false"
      - key: LAVALINK_PORT
        sync: false
      - key: CORS_ORIGINS
        value: https://support-web-dashboard.onrender.com
      # Self-ping keeps the service awake on the free tier (sleep would drop
      # the Discord gateway). 600s < Render's 15-min idle threshold.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "600"
      - key: KEEPALIVE_URL
        value: https://support-web-api.onrender.com/health
      # Only used when a Render Disk is attached (paid plans). Set this to the
      # disk's mount path so the 36 SQLite files under db/ persist across
      # deploys. Leave unset on the free tier (db/ resets on each deploy).
      - key: RENDER_DISK_PATH
        sync: false

  - type: web
    name: support-web-dashboard
    runtime: node
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_URL
        value: https://support-web-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_DASHBOARD_API_KEY
        sync: false
      - key: NEXTAUTH_URL
        value: https://support-web-dashboard.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_ADMIN_IDS
        sync: false
      - key: NEXT_PUBLIC_DEV_IDS
        value: "1466133502939365437"
      - key: NEXT_PUBLIC_BRAND_NAME
        value: Support
      - key: NEXT_PUBLIC_BRAND_NAME_WORD
        value: SW
