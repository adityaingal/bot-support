# Render Blueprint for Support Web (Discord Bot + Web Dashboard)
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. API + Bot Service (Python Web Service)
  #    Hosts both the Discord Bot gateway connection and the FastAPI Dashboard API
  # ---------------------------------------------------------------------------
  - type: web
    name: support-web-api
    runtime: python
    plan: free
    rootDir: bot
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python CodeX.py
    healthCheckPath: /health
    envVars:
      # MUST be fully qualified (e.g. 3.11.9) — bare "3.11" is ignored by Render
      # and falls back to 3.14.x which breaks discord.py login.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: API_ENABLED
        value: "true"
      - key: brand_name
        value: Support
      - key: CREATOR_NAME
        value: OGADI
      - key: CREATOR_ID
        sync: false
      - key: SUPPORT_SERVER_URL
        value: https://discord.gg/UVRWygSpJq
      - key: DISCORD_STATUS
        value: online
      - key: BOT_ACTIVITY
        value: Support | >help
      - key: TUNNEL_ENABLED
        value: "false"

      # --- Required Secrets (fill in when creating Blueprint) ---
      - key: TOKEN
        sync: false
      - key: DASHBOARD_API_KEY
        sync: false
      - key: OWNER_IDS
        sync: false

      # --- Music / Lavalink (optional) ---
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_SECURE
        value: "false"
      - key: LAVALINK_PORT
        sync: false

      # --- CORS (All *.onrender.com are auto-allowed by default) ---
      - key: CORS_ORIGINS
        value: https://support-web-dashboard.onrender.com

      # --- Keepalive (Free Tier Sleep Prevention) ---
      # Automatically resolves RENDER_EXTERNAL_URL if KEEPALIVE_URL is left unset
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL
        value: "600"
      - key: KEEPALIVE_URL
        value: https://support-web-api.onrender.com/health

      # --- Persistent Storage (Optional on Paid Plans) ---
      # If using a paid plan with a Render Disk, mount at /var/data and set RENDER_DISK_PATH to /var/data
      - key: RENDER_DISK_PATH
        sync: false

    # Uncomment this block if using a paid plan with persistent disk storage for SQLite:
    # disk:
    #   name: support-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---------------------------------------------------------------------------
  # 2. Next.js Dashboard Frontend (Node.js Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: support-web-dashboard
    runtime: node
    plan: free
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # Point to your support-web-api service URL
      - key: NEXT_PUBLIC_API_URL
        value: https://support-web-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_DASHBOARD_API_KEY
        sync: false

      # Dashboard OAuth2 & Auth Secret
      - key: NEXTAUTH_URL
        value: https://support-web-dashboard.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false

      # Admin & Branding
      - key: NEXT_PUBLIC_ADMIN_IDS
        sync: false
      - key: NEXT_PUBLIC_DEV_IDS
        value: "1466133502939365437"
      - key: NEXT_PUBLIC_BRAND_NAME
        value: Support
      - key: NEXT_PUBLIC_BRAND_NAME_WORD
        value: SW
